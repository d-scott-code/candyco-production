<!-- LAST-MINUTE open seats (broadcast). Placeholders: {{event_list}} {{board_url}}
     {{event_list}} is an HTML fragment of <li> rows, one per event with open seats. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:24px 0;font-family:-apple-system,'Segoe UI',Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
      <tr><td style="background:#272838;padding:22px 28px;">
        <span style="color:#ffffff;font-size:18px;font-weight:700;">⚡ Last-minute seats — first come, first served</span><br>
        <span style="color:#a8aabf;font-size:12px;">CandyCo Ticket Lottery</span>
      </td></tr>
      <tr><td style="padding:28px;">
        <p style="margin:0 0 16px;font-size:15px;color:#1a1a1a;line-height:1.6;">
          These seats went unclaimed and we don't want them to go to waste. Grab them before
          someone else does — no waiting on a draw:
        </p>
        <ul style="margin:0 0 20px;padding-left:20px;font-size:14px;color:#334155;line-height:1.9;">
          {{event_list}}
        </ul>
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr><td style="background:#1982C4;border-radius:8px;">
            <a href="{{board_url}}" style="display:inline-block;padding:12px 26px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">Claim a seat →</a>
          </td></tr>
        </table>
      </td></tr>
      <tr><td style="padding:16px 28px;border-top:1px solid #e2e8f0;font-size:12px;color:#94a3b8;line-height:1.6;">
        CandyCo employee benefit. — CandyCo HR
      </td></tr>
    </table>
  </td></tr>
</table>
